spring.application.name=artesanias-backend
server.port=8080

# ===== Base de datos MySQL =====
# createDatabaseIfNotExist=true crea la base "artesanias_db" si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/artesanias_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate =====
# update: crea y actualiza las tablas a partir de las entidades (sin borrar datos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Clave para firmar los tokens (mínimo 32 caracteres). En un proyecto real NO se sube a GitHub
jwt.secreto=AleYLeoSpA-ClaveSecretaParaFirmarTokens-2026
# Duración del token: 24 horas (en milisegundos)
jwt.expiracion-ms=86400000
